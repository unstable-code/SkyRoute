<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2f55"/>
      <stop offset="1" stop-color="#0b1426"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="0.5" stop-color="#f2b53c"/>
      <stop offset="1" stop-color="#b8741a"/>
    </linearGradient>
    <radialGradient id="dial" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#23406f"/>
      <stop offset="1" stop-color="#0e1a33"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe3ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="800" rx="120" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="110" cy="130" r="4"/><circle cx="690" cy="110" r="3"/>
    <circle cx="80" cy="560" r="3"/><circle cx="720" cy="620" r="4"/>
    <circle cx="170" cy="720" r="2.5"/><circle cx="640" cy="730" r="2.5"/>
    <circle cx="210" cy="60" r="2.5"/><circle cx="600" cy="40" r="2"/>
  </g>

  <!-- 스톱워치 용두 -->
  <rect x="362" y="58" width="76" height="44" rx="10" fill="url(#gold)"/>
  <rect x="384" y="96" width="32" height="40" fill="url(#gold)"/>
  <rect x="598" y="196" width="50" height="34" rx="8" fill="url(#gold)" transform="rotate(45 623 213)"/>

  <!-- 다이얼 -->
  <circle cx="400" cy="440" r="300" fill="url(#gold)"/>
  <circle cx="400" cy="440" r="268" fill="url(#dial)"/>

  <!-- 경로 진행 링: 남은 구간(점선) + 지나온 구간(금색) -->
  <circle cx="400" cy="440" r="222" fill="none" stroke="#6f8fbf" stroke-width="14"
          stroke-dasharray="2 26" stroke-linecap="round" opacity="0.9"/>
  <path d="M 400 218 A 222 222 0 1 1 191.4 516" fill="none" stroke="url(#gold)"
        stroke-width="26" stroke-linecap="round"/>

  <!-- 경유지: 지나온 곳은 채움, 남은 곳은 빈 원 -->
  <g stroke="#0e1a33" stroke-width="8">
    <circle cx="400" cy="218" r="22" fill="#ffe29a"/>
    <circle cx="592.3" cy="551" r="22" fill="#ffe29a"/>
  </g>
  <circle cx="191.4" cy="516" r="30" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="237" cy="289" r="20" fill="#0e1a33" stroke="#9fb8de" stroke-width="8"/>

  <!-- 날개 -->
  <g transform="translate(262 522)" stroke="#0e1a33" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <path fill="url(#wing)" d="M 0 0
             C 50 -110 180 -175 300 -150
             Q 268 -118 232 -104
             Q 268 -88 272 -80
             Q 236 -64 202 -54
             Q 236 -40 238 -28
             Q 200 -16 166 -10
             Q 192 8 190 20
             Q 150 22 120 22
             Q 136 44 130 56
             Q 60 50 0 0 Z"/>
    <path fill="none" stroke="#9fb8de" stroke-width="7" d="M 48 -28 C 110 -84 180 -108 246 -112"/>
    <path fill="none" stroke="#9fb8de" stroke-width="7" d="M 60 8 C 110 -20 160 -40 208 -52"/>
  </g>
</svg>
